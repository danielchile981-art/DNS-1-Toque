plugins {
    id 'com.android.application'
}

android {
    namespace 'com.daniel.dnsoneclick'
    compileSdk 35

    defaultConfig {
        applicationId 'com.daniel.dnsoneclick'
        minSdk 30
        targetSdk 35
        versionCode 7
        versionName '1.2.3'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.github.SanniniciStyle:libadb-android:f0cbeec53046a2d8f7c3762b4a52c5ef30ccc62c'
    implementation 'com.github.MuntashirAkon:sun-security-android:1.1'
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
}
